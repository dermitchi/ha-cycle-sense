learn_last_cycle:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: cycle_sense
    program:
      required: true
      example: "Baumwolle 40°"
      selector:
        text:
    minutes:
      required: false
      example: 61
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: min

rename_program:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: cycle_sense
    program:
      required: true
      selector:
        text:
    new_name:
      required: true
      selector:
        text:

delete_program:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: cycle_sense
    program:
      required: true
      selector:
        text:

import_history:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: cycle_sense
    days:
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: d
