learn_last_cycle:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: cycle_sense
    program:
      required: true
      example: "Baumwolle 40°"
      selector:
        text:
    minutes:
      required: false
      example: 61
      selector:
        number:
          min: 1
          max: 600
          unit_of_measurement: min

rename_program:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: cycle_sense
    program:
      required: true
      selector:
        text:
    new_name:
      required: true
      selector:
        text:

delete_program:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: cycle_sense
    program:
      required: true
      selector:
        text:

set_load:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: cycle_sense
    load:
      required: true
      example: 33
      selector:
        number:
          min: 5
          max: 100
          unit_of_measurement: "%"
    target:
      default: last
      selector:
        select:
          translation_key: load_target
          options:
            - last
            - next

import_history:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: cycle_sense
    days:
      default: 10
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: d

clear_unassigned:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: cycle_sense
